<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>RB-360 Background Remover</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <h1>Remueve el fondo de tu imagen</h1>
    <input type="file" id="imageInput" accept="image/*">
    <button onclick="uploadImage()">Quitar fondo</button>
    <div id="output">
      <img id="resultImage" alt="Resultado aparecerá aquí">
    </div>
  </div>
  <script src="script.js"></script>
</body>
</html>
